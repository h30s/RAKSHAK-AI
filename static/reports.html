<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threat Reports · CCTV Monitor</title>
  <link rel="stylesheet" href="/static/style.css?v=6">
  <link rel="stylesheet" href="/static/threats.css?v=3">
  <link rel="stylesheet" href="/static/reports.css?v=2">
</head>
<body>
  <header class="topbar">
    <a class="brand brand-link" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>CCTV Monitor</span>
    </a>
    <nav class="tabs" aria-label="Views">
      <a class="tab" href="/">← Dashboard</a>
    </nav>
    <div class="status"><span class="avatar" title="Operator">OP</span></div>
  </header>

  <main class="reports">
    <div class="rp-head">
      <div>
        <h1>Threat Reports</h1>
        <p class="muted">Every threat the system has detected, with what was done about it.</p>
      </div>
      <a id="export" class="btn" href="/api/threats/export.csv" download>Export CSV</a>
    </div>

    <div class="rp-stats">
      <div class="rp-stat"><span id="st-total">–</span><small>Total</small></div>
      <div class="rp-stat bad"><span id="st-active">–</span><small>Active</small></div>
      <div class="rp-stat warn"><span id="st-progress">–</span><small>In progress</small></div>
      <div class="rp-stat ok"><span id="st-resolved">–</span><small>Resolved</small></div>
      <div class="rp-stat"><span id="st-ttr">–</span><small>Avg. time to resolve</small></div>
    </div>

    <div class="rp-filters">
      <input id="q" class="search" type="search" placeholder="Search camera, location, type or ID" autocomplete="off">
      <div class="seg" role="group" aria-label="Status">
        <button type="button" class="seg-btn active" data-status="all">All</button>
        <button type="button" class="seg-btn" data-status="active">Active</button>
        <button type="button" class="seg-btn" data-status="in_progress">In progress</button>
        <button type="button" class="seg-btn" data-status="resolved">Resolved</button>
      </div>
      <select id="days" aria-label="Period">
        <option value="1">Last 24 hours</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="0" selected>All time</option>
      </select>
    </div>

    <div class="rp-table-wrap">
      <table class="rp-table">
        <thead><tr>
          <th>Date &amp; time</th><th>Camera</th><th>Location</th><th>Threat type</th><th class="num">Score</th>
          <th>Status</th><th>Action taken</th><th>Resolved</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No threats match.</p>
    </div>
  </main>

  <script src="/static/threat-ui.js?v=1"></script>
  <script src="/static/reports.js?v=1"></script>
</body>
</html>
